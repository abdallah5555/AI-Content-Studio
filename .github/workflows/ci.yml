name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  web:
    name: Web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build web app
        run: npm run build

  worker:
    name: Worker checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Compile worker
        run: python -m compileall -q services/worker/app
      - name: Verify SQLite job persistence
        env:
          JOB_DB_PATH: /tmp/ai-content-studio-ci.db
        run: |
          PYTHONPATH=services/worker python - <<'PY'
          from app.job_store import init_job_store, save_job, load_jobs, list_job_summaries
          init_job_store()
          job = {
              "id": "ci-job",
              "status": "waiting_review",
              "stage": "script",
              "progress": 22,
              "input": {"idea_prompt": "test"},
              "outputs": {"script": {"content": {"title": "CI Test"}}},
          }
          save_job(job)
          restored = load_jobs()
          assert restored["ci-job"]["outputs"]["script"]["content"]["title"] == "CI Test"
          assert list_job_summaries(1)[0]["id"] == "ci-job"
          PY
      - name: Verify FFmpeg
        run: |
          ffmpeg -version | head -n 1
          ffmpeg -filters | grep -E ' subtitles | ass '
          PYTHONPATH=services/worker python -c "from app.video_edit import ffmpeg_available; assert ffmpeg_available(), 'FFmpeg not available'"
