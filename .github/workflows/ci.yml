name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  web:
    name: Web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: TypeScript lint
        run: npm run lint
      - name: Build web app
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser E2E
        run: npm --workspace apps/web run e2e

  intelligence:
    name: Content intelligence contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install minimal dependencies
        run: pip install fastapi pydantic python-multipart
      - name: Inspect router contract
        env:
          INTELLIGENCE_DB_PATH: /tmp/ai-content-intelligence-fast-ci.db
          REFERENCE_DB_PATH: /tmp/ai-content-references-fast-ci.db
        run: |
          PYTHONPATH=services/worker python - <<'PY'
          from app.content_intelligence import router, _parse_google_trends
          paths = sorted(getattr(route, "path", "") for route in router.routes)
          print("router routes=", paths)
          assert paths, "content intelligence router has no routes"
          assert any(path.endswith("/trends") for path in paths), paths
          xml = '''<?xml version="1.0" encoding="UTF-8"?><rss xmlns:ht="https://trends.google.com/trending/rss"><channel><item><title>قاع الهامور</title><ht:approx_traffic>10K+</ht:approx_traffic><pubDate>Sun, 13 Sep 2026 15:00:00 +0000</pubDate></item></channel></rss>'''
          items = _parse_google_trends(xml, "EG")
          assert items[0]["traffic"] == 10000
          PY

  worker:
    name: Worker checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install worker dependencies
        run: pip install -r services/worker/requirements.txt
      - name: Compile worker
        run: python -m compileall -q services/worker/app
      - name: Verify SQLite persistence
        env:
          JOB_DB_PATH: /tmp/ai-content-studio-ci.db
          INTELLIGENCE_DB_PATH: /tmp/ai-content-intelligence-ci.db
          REFERENCE_DB_PATH: /tmp/ai-content-references-ci.db
          SCHEDULE_DB_PATH: /tmp/ai-content-schedule-ci.db
        run: |
          PYTHONPATH=services/worker python - <<'PY'
          from app.job_store import init_job_store, save_job, load_jobs, list_job_summaries
          from app.reference_store import init_reference_store, save_reference, load_references
          from app.intelligence_store import add_idea, get_brand_profile, init_intelligence_store, list_ideas, save_brand_profile
          from app.scheduler import create_scheduled, list_scheduled, ScheduleRequest
          init_job_store()
          job = {"id":"ci-job","status":"waiting_review","stage":"script","progress":22,"input":{"idea_prompt":"test"},"outputs":{"script":{"content":{"title":"CI Test"}}}}
          save_job(job)
          restored = load_jobs()
          assert restored["ci-job"]["outputs"]["script"]["content"]["title"] == "CI Test"
          assert list_job_summaries(1)[0]["id"] == "ci-job"
          init_reference_store()
          reference = {"id":"ci-reference","name":"reference.png","kind":"image","mime_type":"image/png","size_bytes":12,"sha256":"abc","analysis_status":"ready","analysis":{"style_summary":"clean 3D"},"analysis_error":None}
          save_reference("ci-reference", "/tmp/reference.png", reference)
          references = load_references()
          assert any(item["id"] == "ci-reference" and item["payload"]["analysis"]["style_summary"] == "clean 3D" for item in references)
          init_intelligence_store()
          idea = add_idea("فكرة تريند تجريبية", ["trend"])
          assert any(item["id"] == idea["id"] for item in list_ideas())
          save_brand_profile({"voice":"friendly Egyptian Arabic","content_pillars":["AI"]})
          assert get_brand_profile()["profile"]["voice"] == "friendly Egyptian Arabic"
          created = create_scheduled(ScheduleRequest(job_id="ci-job", platform="tiktok", scheduled_at="2026-09-14T18:00:00+00:00", title="CI Schedule"))
          assert created["item"]["job_id"] == "ci-job"
          assert any(item["id"] == created["item"]["id"] for item in list_scheduled()["items"])
          PY
      - name: Verify worker app import
        env:
          JOB_DB_PATH: /tmp/ai-content-studio-app-ci.db
          INTELLIGENCE_DB_PATH: /tmp/ai-content-intelligence-app-ci.db
          REFERENCE_DB_PATH: /tmp/ai-content-references-app-ci.db
          SCHEDULE_DB_PATH: /tmp/ai-content-schedule-app-ci.db
        run: |
          PYTHONPATH=services/worker python - <<'PY'
          from app.content_intelligence import router
          from app.main import app
          router_paths = sorted(getattr(route, "path", "") for route in router.routes)
          app_paths = sorted(getattr(route, "path", "") for route in app.routes)
          print("app.version=", app.version)
          print("router routes=", router_paths)
          print("app routes=", app_paths)
          assert app.version == "1.3.1", f"unexpected app version: {app.version}"
          assert router_paths, "content intelligence router has no routes"
          assert "/intelligence/trends" in app_paths, f"missing /intelligence/trends; router={router_paths}; app={app_paths}"
          assert "/schedule" in app_paths, f"missing /schedule; app={app_paths}"
          assert "/providers/status" in app_paths, f"missing provider status; app={app_paths}"
          assert "/music/library" in app_paths, f"missing music library; app={app_paths}"
          PY
      - name: Verify trend scoring parser
        env:
          INTELLIGENCE_DB_PATH: /tmp/ai-content-intelligence-trends-ci.db
        run: |
          PYTHONPATH=services/worker python - <<'PY'
          from app.content_intelligence import _parse_google_trends
          xml = '''<?xml version="1.0" encoding="UTF-8"?><rss xmlns:ht="https://trends.google.com/trending/rss"><channel><item><title>قاع الهامور</title><ht:approx_traffic>10K+</ht:approx_traffic><pubDate>Sun, 13 Sep 2026 15:00:00 +0000</pubDate></item></channel></rss>'''
          items = _parse_google_trends(xml, "EG")
          assert items[0]["title"] == "قاع الهامور"
          assert items[0]["traffic"] == 10000
          assert 0 <= items[0]["score"] <= 100
          PY
      - name: Verify FFmpeg
        run: |
          ffmpeg -version | head -n 1
          ffmpeg -filters | grep -E ' subtitles | ass '
          PYTHONPATH=services/worker python -c "from app.video_edit import ffmpeg_available; assert ffmpeg_available(), 'FFmpeg not available'"
